# Incendios forestales en Perú · peruvian.dev/incendios (se incluye dentro del server { } de peruvian.dev)
#
# Regla de oro: lo que la propia página pide nunca debe responder 400/403/404, porque CrowdSec
# (http-probing) banea la IP y, detrás de CGNAT, eso deja fuera a muchas personas.
#
#   /srv/incendios        -> enlace a la versión activa del sitio (index, assets, data/ref)
#   /srv/incendios-data   -> datos que genera el actualizador cada 10 minutos (usuario incendios)

location = /incendios { return 301 /incendios/; }

# La caché interna del actualizador no se publica (la página nunca la pide).
location ^~ /incendios/data/cache/ { return 404; }

# Referencias geográficas (vienen con el sitio): se pueden cachear un día.
location ^~ /incendios/data/ref/ {
    alias /srv/incendios/data/ref/;
    types { application/geo+json geojson; application/json json; }
    error_page 404 = @incendios_vacio;
    include /etc/nginx/snippets/incendios-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "*" always;
    gzip on; gzip_types application/json application/geo+json; gzip_min_length 1024;
}
# Datos generados. Un archivo que todavía no existe responde {} con 200 (ver la regla de oro).
location ^~ /incendios/data/ {
    alias /srv/incendios-data/;
    error_page 404 = @incendios_vacio;
    include /etc/nginx/snippets/incendios-headers.conf;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    charset utf-8;
    charset_types application/json;
    gzip on; gzip_types application/json; gzip_min_length 1024;
    autoindex on;                    # datos abiertos: cualquiera puede recorrer la carpeta
}
location @incendios_vacio {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '{}';
}

# Librerías (three.js, Leaflet, fuente): cambian poco, caché de una semana.
location ^~ /incendios/assets/vendor/ {
    alias /srv/incendios/assets/vendor/;
    include /etc/nginx/snippets/incendios-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    gzip on; gzip_types text/css application/javascript text/javascript; gzip_min_length 1024;
}
location ^~ /incendios/assets/fonts/ {
    alias /srv/incendios/assets/fonts/;
    include /etc/nginx/snippets/incendios-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}
# Código propio: el navegador revalida (ETag) para recibir cada versión al instante.
location ^~ /incendios/assets/ {
    alias /srv/incendios/assets/;
    include /etc/nginx/snippets/incendios-headers.conf;
    add_header Cache-Control "no-cache" always;
    gzip on; gzip_types text/css application/javascript text/javascript image/svg+xml; gzip_min_length 1024;
}
location ^~ /incendios/ {
    alias /srv/incendios/;
    index index.html;
    include /etc/nginx/snippets/incendios-headers.conf;
    add_header Cache-Control "no-cache" always;
    gzip on; gzip_types text/css application/javascript application/json application/manifest+json; gzip_min_length 1024;
}
