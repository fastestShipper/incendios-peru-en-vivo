# Cabeceras de seguridad de /incendios (se incluye en cada location, porque add_header no se hereda
# cuando el location define las suyas). El mapa 2D carga teselas de OSM, Esri y NASA GIBS (solo imágenes).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com https://gibs.earthdata.nasa.gov; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'" always;
